---
name: CI-Xbox Original
permissions: {}

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  build:
    name: ${{ matrix.toolchain }} toolchain
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            toolchain: macOS
            shell: "bash"
          - os: ubuntu-latest
            toolchain: Linux
            shell: "bash"
          - os: windows-latest
            toolchain: Windows
            shell: "msys2 {0}"
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      CMAKE_BUILD: build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive

      - name: Setup Dependencies Linux
        if: runner.os == 'Linux'
        run: |
          nxdk_dependencies=(
            "bison"
            "build-essential"
            "clang"
            "cmake"
            "flex"
            "git"
            "lld"
            "llvm"
            "nasm"
          )
          sunshine_dependencies=(
            "patch"
            # Xvfb brings xauth. Mesa GLX brings the software OpenGL driver.
            "libglx-mesa0"
            "libusb-1.0-0"
            "xvfb"
          )
          dependencies=("${nxdk_dependencies[@]}" "${sunshine_dependencies[@]}")
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y "${dependencies[@]}"

      - name: Setup Dependencies macOS
        if: runner.os == 'macOS'
        run: |
          nxdk_dependencies=(
            "cmake"
            "coreutils"
            "lld"
            "llvm"
            "nasm"
          )
          sunshine_dependencies=(
          )
          dependencies=("${nxdk_dependencies[@]}" "${sunshine_dependencies[@]}")
          brew install "${dependencies[@]}"
          echo "$(brew --prefix llvm)/bin" >> "${GITHUB_PATH}"

      - name: Setup Dependencies Windows
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c  # v2.34.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            bison
            diffutils
            flex
            git
            make
            patch
            perl
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-compiler-rt
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-lld
            mingw-w64-ucrt-x86_64-llvm
            mingw-w64-ucrt-x86_64-llvm-tools
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-mesa
            mingw-w64-ucrt-x86_64-nasm

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh --build-dir "${CMAKE_BUILD}" --xbox-coverage

          # recursively list all files in build directory
          ls -R "${CMAKE_BUILD}"

          # move artifacts
          mkdir -p artifacts
          tar -czf artifacts/Sunshine-client-XboxOG-XBE.tar.gz "./${CMAKE_BUILD}/xbox/xbe"
          cp "${CMAKE_BUILD}/xbox/Sunshine.iso" artifacts/Sunshine-client-XboxOG.iso

      - name: Upload Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: Sunshine-client-XboxOG-${{ runner.os }}
          path: artifacts/

      - name: Set up xemu
        shell: bash
        run: bash scripts/setup-xemu.sh

      - name: Set up Windows software OpenGL
        if: runner.os == 'Windows'
        run: |
          cp "${MINGW_PREFIX}/bin/"{opengl32,libgallium_wgl}.dll .local/xemu/app/
          cygpath -w "${MINGW_PREFIX}/bin" >> "${GITHUB_PATH}"
          # The hosted runner's Microsoft Basic Render Driver can exit during xemu startup.
          echo 'LIBGL_ALWAYS_SOFTWARE=1' >> "${GITHUB_ENV}"
          echo 'GALLIUM_DRIVER=llvmpipe' >> "${GITHUB_ENV}"

      - name: Test and report Xbox guest coverage
        uses: ./.github/actions/test-and-report
        with:
          build-dir: ${{ env.CMAKE_BUILD }}/xbox
          platform: Xbox-guest-xemu-${{ runner.os }}
          xemu-tests: 'true'
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
